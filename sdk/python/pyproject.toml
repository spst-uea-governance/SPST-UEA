[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spst-uea-sdk"
version = "0.1.0"
description = "Local client SDK for the SPST-UEA web cockpit contract"
requires-python = ">=3.11"
dependencies = ["spst-runtime>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
