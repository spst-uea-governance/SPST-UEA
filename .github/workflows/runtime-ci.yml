name: Runtime CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_CLI_VERSION: "0.144.5"
      SPST_PROVENANCE_KEY: ci-live-db-hash-guard-public-test-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Install pinned Codex CLI for discovery probe
        shell: bash
        run: >-
          npm install
          --prefix "$RUNNER_TEMP/codex-skill-discovery-cli"
          --ignore-scripts
          --no-audit
          --no-fund
          "@openai/codex@${CODEX_CLI_VERSION}"
      - name: Verify fresh Codex process discovers repository skill
        shell: bash
        run: |
          python runtime/scripts/codex_skill_discovery_probe.py \
            --codex "$RUNNER_TEMP/codex-skill-discovery-cli/node_modules/.bin/codex" \
            --repository-root . \
            --isolation-root "$RUNNER_TEMP/codex-aether-discovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --payload-output "$RUNNER_TEMP/codex-aether-discovery-prompt-input.json" \
            --expected-cli-version "$CODEX_CLI_VERSION"
          python runtime/scripts/codex_skill_discovery_probe.py \
            --codex "$RUNNER_TEMP/codex-skill-discovery-cli/node_modules/.bin/codex" \
            --repository-root . \
            --isolation-root "$RUNNER_TEMP/codex-project-context-discovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --payload-output "$RUNNER_TEMP/codex-project-context-discovery-prompt-input.json" \
            --expected-cli-version "$CODEX_CLI_VERSION" \
            --skill-name spst-project-context
      - name: Configure isolated Live DB guard paths
        shell: bash
        run: |
          guard_dir="${RUNNER_TEMP}/spst-live-db-hash-guard"
          echo "SPST_COCKPIT_DB_PATH=${guard_dir}/spst_cockpit.db" >> "$GITHUB_ENV"
          echo "LIVE_DB_GUARD_MANIFEST=${guard_dir}/manifest.json" >> "$GITHUB_ENV"
      - name: Install runtime and verification dependencies
        run: |
          python -m pip install -e "./runtime[dev]"
          python -m pip check
      - name: Prepare Live DB hash guard
        working-directory: runtime
        run: >-
          python scripts/live_db_hash_guard.py prepare
          --db "$SPST_COCKPIT_DB_PATH"
          --manifest "$LIVE_DB_GUARD_MANIFEST"
          --workspace .
      - name: Verify import isolation
        working-directory: runtime
        run: |
          python -c "import spst_runtime.web"
          python scripts/live_db_hash_guard.py verify --manifest "$LIVE_DB_GUARD_MANIFEST"
      - name: Run full runtime suite with branch coverage
        working-directory: runtime
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q
      - name: Verify Live DB guard after full suite
        if: always()
        working-directory: runtime
        run: python scripts/live_db_hash_guard.py verify --manifest "$LIVE_DB_GUARD_MANIFEST"
      - name: Combine parent and subprocess coverage
        working-directory: runtime
        run: python -m coverage combine
      - name: Enforce branch coverage floor
        working-directory: runtime
        run: python -m coverage report
      - name: Run Ruff
        working-directory: runtime
        run: ruff check .
      - name: Run mypy
        working-directory: runtime
        run: python -m mypy spst_runtime
      - name: Check patch whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root --no-commit-id -r "$GITHUB_SHA"
          else
            git diff --check "${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi
