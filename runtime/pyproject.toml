[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="spst-runtime"
version="0.1.1"
description="Reference runtime for SPST-UEA"
license={text="Apache-2.0"}
requires-python=">=3.11"
dependencies=[
  "pydantic>=2",
  "fastapi>=0.115",
  "cryptography>=43"
]

[project.optional-dependencies]
dev=[
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "coverage[toml]>=7.6",
  "ruff>=0.6",
  "mypy>=1.10"
]

[project.scripts]
spst-runtime="spst_runtime.cli:main"

[tool.setuptools]
package-dir={""="."}

[tool.setuptools.packages.find]
include=["spst_runtime*"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts=["--strict-config", "--strict-markers"]
markers=[
  "conformance: marks tests for SPST-UEA RFC normative conformance"
]

[tool.ruff]
line-length=100

[tool.mypy]
python_version="3.11"
check_untyped_defs=true
warn_unused_configs=true

[tool.coverage.run]
branch=true
source=["spst_runtime"]
parallel=true
patch=["subprocess"]

[tool.coverage.report]
fail_under=80
show_missing=true
skip_covered=true
